name: Release (shop-trade)

# Publish with: gh release create shop-trade-vX.Y.Z --latest=false
# --latest=false matters: op5e's manifest is releases/latest, and a shop-trade release must not become "latest".
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    if: ${{ startsWith(github.event.release.tag_name, 'shop-trade-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches module.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          v=$(node -p "require('./shop-trade/module.json').version")
          [ "$TAG" = "shop-trade-v$v" ] || { echo "tag $TAG does not match module.json version $v"; exit 1; }

      - name: Package
        working-directory: shop-trade
        run: zip -r ../shop-trade.zip module.json scripts templates styles lang

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" shop-trade.zip shop-trade/module.json --clobber
